spring.cloud.config.enabled=false
spring.application.name=USER-CATALOG-SERVICE
server.port=8088

# ========================================================
# ? POSTGRESQL LAYER (RAILWAY VARIABLES)
# ========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Allow bean overriding for our offline mock configuration component
spring.main.allow-bean-definition-overriding=true

# ========================================================
# ? LIVE REDIS MATRIX (RAILWAY VARIABLES)
# ========================================================
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}
spring.data.redis.password=${SPRING_REDIS_PASSWORD}

# ========================================================
# ?? SERVICE REGISTRY MAPPING ENGINE (EUREKA)
# ========================================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# ========================================================
# ?? SECURITY & UTILITY TOKENS (RAILWAY VARIABLES)
# ========================================================
ghost.shield.jwt-secret=${JWT_SECRET}
ghost.shield.jwt-expiration=86400000

