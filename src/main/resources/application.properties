spring.cloud.config.enabled=false
spring.application.name=USER-CATALOG-SERVICE
server.port=8088

# ========================================================
# ? CORE LIVE PERSISTENT STORAGE: POSTGRESQL LAYER
# ========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ghost_social?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Allow bean overriding for our offline mock configuration component
spring.main.allow-bean-definition-overriding=true

# ========================================================
# ?? SERVICE REGISTRY MAPPING ENGINE (EUREKA)
# ========================================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# ========================================================
# ? SECURITY & UTILITY TOKENS
# ========================================================
ghost.shield.jwt-secret=SuperSecurePermanentSecretKeyThatIsAtLeast64BytesLongForSecurityGuarantees
ghost.shield.jwt-expiration=86400000

