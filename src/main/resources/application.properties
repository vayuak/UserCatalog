spring.cloud.config.enabled=false
spring.application.name=USER-CATALOG-SERVICE
server.port=${PORT:8088}

# ========================================================
# ? CORE LIVE PERSISTENT STORAGE: POSTGRESQL LAYER
# ========================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ghost_social}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Allow bean overriding for our offline mock configuration component
spring.main.allow-bean-definition-overriding=true

# Set maximum connection lifetime to 4 minutes (240000 ms) to beat Railway's idle timeout
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.maximum-pool-size=25
# Keep idle connections alive by pinging the DB every 30 seconds
spring.datasource.hikari.keepalive-time=30000

# ========================================================
# ? LIVE DISTRIBUTED MEMORY STORAGE: REDIS (RAILWAY READY)
# ========================================================
spring.data.redis.host=${SPRING_REDIS_HOST:nozomi.proxy.rlwy.net}
spring.data.redis.port=${SPRING_REDIS_PORT:44303}
spring.data.redis.password=${SPRING_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false

# ========================================================
# ?? SECURITY & UTILITY TOKENS
# ========================================================
ghost.shield.jwt-secret=${JWT_SECRET:SuperSecurePermanentSecretKeyThatIsAtLeast64BytesLongForSecurityGuarantees}
ghost.shield.jwt-expiration=86400000

# ========================================================
# ? 2G/3G NETWORK OPTIMIZATION ENGINE
# ========================================================
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# ========================================================
# ? LIVE TELECOM INTERFACE: BREVO SMTP (FREE TIER)
# ========================================================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_LOGIN_EMAIL:adityakakade.skncoe.comp@gmail.com}
spring.mail.password=${BREVO_SMTP_KEY:xsmtpsib-789de4d261570ac12f1491040a3c54b633152dd1a1d1afed939af21258a440ed-27SKcZxZJDM5gmph}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# CRITICAL: Prevent infinite hangs with explicit 5-second socket timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========================================================
# ? SERVICE REGISTRY DISABLED
# ========================================================
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false